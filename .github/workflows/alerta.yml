name: Executar Alerta Diario TCE-RN

on:
  schedule:
    - cron: '31 23 * * *'
  workflow_dispatch:

jobs:
  verificar:
    runs-on: ubuntu-latest
    
    # Adicionado: Concede permissão para o robô abrir a Issue no repositório
    permissions:
      issues: write

    steps:
    - name: Baixar o código do repositório
      uses: actions/checkout@v4.2.2

    - name: Executar script de verificação
      id: checagem
      continue-on-error: true
      run: python3 alerta_diario.py

    - name: Criar Alerta por E-mail (via GitHub Issues)
      if: steps.checagem.outcome == 'success'
      uses: imjohnbo/issue-bot@v3
      with:
        title: "🚨 Alerta: Termo encontrado no Diário Oficial TCE-RN!"
        body: "O termo buscado foi localizado nos dados publicados na API hoje. Verifique os diários eletrônicos do TCE-RN."
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
